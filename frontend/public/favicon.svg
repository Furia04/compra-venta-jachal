<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4965"/>
      <stop offset="100%" stop-color="#0F2C3D"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D9822B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#2E6B8F" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Icon Group with subtle shadow -->
  <g filter="url(#shadow)">
    <!-- Shopping Bag Handle -->
    <path d="M25 24 C25 17 39 17 39 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Bag Body -->
    <path d="M17 24 L47 24 C48.5 24 49.5 25.2 49.2 26.6 L45.8 46.8 C45.4 49.2 43.4 51 41 51 L23 51 C20.6 51 18.6 49.2 18.2 46.8 L14.8 26.6 C14.5 25.2 15.5 24 17 24 Z" fill="url(#bagGrad)"/>
    
    <!-- Top fold line / flap -->
    <path d="M15 24 L20 18 L44 18 L49 24 Z" fill="#F59E0B" opacity="0.6"/>

    <!-- Bag Inner Pocket / Smile Handle Accent -->
    <path d="M26 29 C26 33.5 38 33.5 38 29" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

    <!-- "JV" Monogram / Brand mark -->
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">JV</text>
  </g>
</svg>